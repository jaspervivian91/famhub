<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Heart-roof house — shape preserved from v3/brutalist mark; recoloured for the warm palette.
       Roof: forest green. Body: soft charcoal outline. Window: terracotta light (a moment of warmth). -->
  <path
    d="M50 10
       C 50 10, 25 28, 15 38
       C 5 48, 5 58, 15 65
       C 25 72, 35 68, 50 58
       C 65 68, 75 72, 85 65
       C 95 58, 95 48, 85 38
       C 75 28, 50 10, 50 10Z"
    fill="#3A6B4A"
  />
  <rect
    x="25" y="55"
    width="50" height="40"
    rx="0" ry="0"
    fill="transparent"
    stroke="#1A1A1A"
    stroke-width="3"
  />
  <circle
    cx="50" cy="75"
    r="10"
    fill="#D4845A"
  />
  <line
    x1="25" y1="95"
    x2="75" y2="95"
    stroke="#1A1A1A"
    stroke-width="2"
    opacity="0.35"
  />
</svg>
